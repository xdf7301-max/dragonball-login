<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Key - Dragon Ball Z</title>
    <!-- Iconos para candado, usuario, sonido y check -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background-color: #0b0f19;
        }

        /* Video de fondo 100% nítido y brillante */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
        }

        /* Botón Flotante para Audio/Música de Fondo */
        .audio-control-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .audio-control-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.1);
        }

        /* Contenedor del Borde RGB Animado */
        .rgb-wrapper {
            position: relative;
            width: 100%;
            max-width: 380px;
            border-radius: 22px;
            padding: 3px;
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%;
            animation: rgbGlow 4s linear infinite;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
            transition: all 0.4s ease;
        }

        @keyframes rgbGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Clase para apagar las luces RGB */
        .rgb-wrapper.rgb-off {
            animation: none;
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        /* Tarjeta Glassmorphism (Interior) */
        .login-card {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 2.2rem 2rem;
            width: 100%;
            text-align: center;
            color: #fff;
            transition: background 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Contenedor de la Imagen / Logo */
        .profile-img-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 1.2rem auto;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
        }

        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .login-card h2 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            letter-spacing: 0.5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        /* Campos de Entrada */
        .input-box {
            position: relative;
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .input-box label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.3rem;
            color: #f0f0f0;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
        }

        .input-field {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.8);
            padding: 0.5rem 2rem 0.5rem 0;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-field input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .input-field input:focus {
            border-bottom-color: #00ffff;
        }

        .input-field i {
            position: absolute;
            right: 0.5rem;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
        }

        /* Opciones: Recordar */
        .options {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            font-size: 0.75rem;
            margin-bottom: 1.2rem;
            color: #f0f0f0;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
        }

        .options label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
        }

        /* Panel de Personalización */
        .custom-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 0.5rem 0.8rem;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-bottom: 1.5rem;
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .control-item input[type="color"] {
            appearance: none;
            -webkit-appearance: none;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        .control-item input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .control-item input[type="color"]::-webkit-color-swatch {
            border: 1.5px solid #fff;
            border-radius: 50%;
        }

        /* Botón Blanco */
        .btn-submit {
            width: 100%;
            padding: 0.75rem;
            background: #ffffff;
            color: #111;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        .btn-submit:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.4);
        }

        .error-msg {
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
            font-weight: 600;
        }

        .hidden {
            display: none !important;
        }

        /* Dashboard de Bienvenida */
        .dashboard {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(20px);
            padding: 3rem 2rem;
            border-radius: 20px;
            text-align: center;
            color: #fff;
            width: 100%;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.6s ease-in-out;
            transition: background 0.3s ease;
        }

        .dashboard h1 {
            color: #ffcc00;
            margin-bottom: 1.2rem;
            font-size: 1.6rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .dashboard p {
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
        }

        .logout-btn {
            background: #ff3333;
            color: #fff;
            border: none;
            padding: 0.6rem 1.8rem;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: #e02828;
        }
    </style>
</head>
<body>

    <!-- Botón de Control de Audio -->
    <button class="audio-control-btn" id="audioToggleBtn" onclick="toggleAudio()" title="Activar / Desactivar Sonido">
        <i class="fa-solid fa-volume-xmark" id="audioIcon"></i>
    </button>

    <!-- Video de fondo (fondo.mp4 en la misma carpeta) -->
    <video id="bgVideo" autoplay muted loop class="bg-video">
        <source src="fondo.mp4" type="video/mp4">
    </video>

    <!-- Audio de Éxito al validar la Key (Busca un archivo llamado success.mp3 o cámbiale el nombre aquí) -->
    <audio id="successAudio" src="success.mp3"></audio>

    <!-- Envoltorio con Contorno RGB -->
    <div id="cardWrapper" class="rgb-wrapper">
        
        <!-- Tarjeta de Login -->
        <div id="loginCard" class="login-card">
            
            <!-- Imagen de perfil / logo -->
            <div class="profile-img-container">
                <img src="imagen.png" alt="Dragon Ball Character" id="profileImage">
            </div>

            <h2>Iniciar Sesión</h2>
            
            <form onsubmit="handleLogin(event)">
                <div class="input-box">
                    <label>Usuario / Email</label>
                    <div class="input-field">
                        <input type="text" id="userInput" placeholder="Ej. Goku Z">
                        <i class="fa-regular fa-user"></i>
                    </div>
                </div>

                <div class="input-box">
                    <label>Key de Acceso</label>
                    <div class="input-field">
                        <input type="password" id="keyInput" placeholder="Ingresa tu Key">
                        <i class="fa-solid fa-key"></i>
                    </div>
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox"> Recordar
                    </label>
                </div>

                <!-- Panel con Selector de Color Interior y Control del RGB Exterior -->
                <div class="custom-controls">
                    <div class="control-item">
                        <span>Color Interior:</span>
                        <input type="color" id="bgColorPicker" value="#000000" title="Cambiar color interno" onchange="changeInnerColor(this.value)">
                    </div>
                    <div class="control-item">
                        <label>
                            <input type="checkbox" id="rgbToggle" checked onchange="toggleRGB(this.checked)">
                            Borde RGB
                        </label>
                    </div>
                </div>

                <div id="errorMsg" class="error-msg"></div>

                <button type="submit" id="submitBtn" class="btn-submit">Acceder</button>
            </form>
        </div>

        <!-- Pantalla al acceder -->
        <div id="dashboardCard" class="dashboard hidden">
            <h1 id="welcomeUser">¡BIENVENID@! 🐉</h1>
            <p>SOY FUERTE PERO CRISTO REY LO ES MAS</p>
            <button class="logout-btn" onclick="handleLogout()">Cerrar Sesión</button>
        </div>
    </div>

    <script>
        // LISTA DE KEYS VÁLIDAS
        const VALID_KEYS = [
            "QGoF3-JS4xn",
            "UvCGT-KwfN0",
            "THsP2-pWI18",
            "lZ3CE-FTiav"
        ];

        // Control del Audio del video de fondo
        function toggleAudio() {
            const video = document.getElementById('bgVideo');
            const icon = document.getElementById('audioIcon');

            if (video.muted) {
                video.muted = false;
                icon.className = 'fa-solid fa-volume-high';
            } else {
                video.muted = true;
                icon.className = 'fa-solid fa-volume-xmark';
            }
        }

        // Cambiar únicamente el color del FONDO INTERIOR
        function changeInnerColor(hexColor) {
            let r = parseInt(hexColor.slice(1, 3), 16);
            let g = parseInt(hexColor.slice(3, 5), 16);
            let b = parseInt(hexColor.slice(5, 7), 16);
            
            const loginCard = document.getElementById('loginCard');
            const dashboardCard = document.getElementById('dashboardCard');
            
            loginCard.style.background = `rgba(${r}, ${g}, ${b}, 0.5)`;
            dashboardCard.style.background = `rgba(${r}, ${g}, ${b}, 0.8)`;
        }

        // Activar o desactivar las LUCES RGB del contorno
        function toggleRGB(enabled) {
            const wrapper = document.getElementById('cardWrapper');
            if (enabled) {
                wrapper.classList.remove('rgb-off');
            } else {
                wrapper.classList.add('rgb-off');
            }
        }

        // Validación de Login
        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('userInput').value.trim();
            const key = document.getElementById('keyInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (user === '' || key === '') {
                errorMsg.style.color = '#ff4d4d';
                errorMsg.innerText = 'Debes ingresar tu usuario y tu Key de acceso';
                errorMsg.style.display = 'block';
                return;
            }

            // Verificar si la Key ingresada es válida
            if (VALID_KEYS.includes(key)) {
                // Mostrar mensaje de éxito en verde con icono de check
                errorMsg.style.color = '#48ff00';
                errorMsg.innerHTML = '<i class="fa-solid fa-circle-check"></i> ¡Acceso exitoso!';
                errorMsg.style.display = 'block';

                // Reproducir el audio de éxito
                const successAudio = document.getElementById('successAudio');
                if (successAudio) {
                    successAudio.currentTime = 0;
                    successAudio.play().catch(err => console.log("Audio play error:", err));
                }

                // Esperar 1.2 segundos para que se escuche el audio y se vea el mensaje antes de cambiar de pantalla
                setTimeout(() => {
                    errorMsg.style.display = 'none';
                    document.getElementById('welcomeUser').innerText = `¡BIENVENID@, ${user.toUpperCase()}! 🐉`;
                    document.getElementById('loginCard').classList.add('hidden');
                    document.getElementById('dashboardCard').classList.remove('hidden');
                }, 1200);

            } else {
                errorMsg.style.color = '#ff4d4d';
                errorMsg.innerText = 'Key de acceso inválida o expirada.';
                errorMsg.style.display = 'block';
            }
        }

        // Cerrar Sesión
        function handleLogout() {
            document.getElementById('userInput').value = '';
            document.getElementById('keyInput').value = '';
            document.getElementById('dashboardCard').classList.add('hidden');
            document.getElementById('loginCard').classList.remove('hidden');
        }
    </script>
</body>
</html>
